services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: dslama
      POSTGRES_PASSWORD: dslama-local-only
      POSTGRES_DB: dslama
    volumes:
      - dslama-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dslama -d dslama"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dslama-pg-data:
