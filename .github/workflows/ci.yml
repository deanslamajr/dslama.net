name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    # Same base image as stage one of the production Dockerfile.
    # Prisma 3.0.2 needs OpenSSL 1.1, which current Ubuntu runners do not ship.
    container: node:12.16.0
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run codegen
      - run: npx prisma generate
      - run: npm run typecheck
      - name: Prisma schema files hold identical models
        shell: bash
        run: diff <(tail -n +9 prisma/schema.prisma) <(tail -n +9 prisma/migration.schema.prisma)
      - name: No credential logging
        shell: bash
        run: |
          if git grep -nE 'console\.[a-z]+\(.*(DB_PASS|DB_USER|SESSION_COOKIE_SECRET|DATABASE_URL|postgresql://)' -- . ':(exclude)docs' ':(exclude).github'; then
            echo "A console call prints a credential."
            exit 1
          fi
      - run: npm run build
      - name: npm audit (report only)
        run: npm audit --audit-level=high || true
