name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml. The integration tests use dslama_test.
      postgres:
        image: postgres:17-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: dslama
          POSTGRES_PASSWORD: dslama-local-only
          POSTGRES_DB: dslama_test
        options: >-
          --health-cmd "pg_isready -U dslama -d dslama_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # npm steps run in the same base image as stage one of the production Dockerfile.
      # --network host lets the integration tests reach the service container on localhost:5433.
      NODE: docker run --rm --network host -v ${{ github.workspace }}:/app -w /app node:22.23.4-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: No credential logging
        run: |
          if git grep -nE '(console|logger)\.[a-z]+\(.*(DB_PASS|DB_USER|SESSION_COOKIE_SECRET|DATABASE_URL|postgresql://)' -- . ':(exclude)docs' ':(exclude).github'; then
            echo "A console or logger call prints a credential."
            exit 1
          fi
      - run: $NODE npm ci
      - run: $NODE npm run codegen
      - run: $NODE npx prisma generate
      - run: $NODE npm run typecheck
      - run: $NODE npm run lint
      - run: $NODE npm test
      - run: $NODE npm run test:integration
      - run: $NODE npm run build
      - run: $NODE npm run check:csp
      - name: npm audit (report only)
        run: $NODE npm audit --audit-level=high || true
