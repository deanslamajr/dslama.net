name: ci
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose.yml. The integration tests use dslama_test.
      postgres:
        image: postgres:17-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: dslama
          POSTGRES_PASSWORD: dslama-local-only
          POSTGRES_DB: dslama_test
        options: >-
          --health-cmd "pg_isready -U dslama -d dslama_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # npm steps run in the same base image as stage one of the production Dockerfile.
      # Prisma 3.0.2 needs OpenSSL 1.1, which current Ubuntu runners do not ship.
      # The job itself runs on the host, because the runner's Node for actions
      # needs a newer glibc than node:12.16.0 has.
      # --network host lets the integration tests reach the service container on localhost:5433.
      NODE12: docker run --rm --network host -v ${{ github.workspace }}:/app -w /app node:12.16.0
    steps:
      - uses: actions/checkout@v4
      - name: Prisma schema files hold identical models
        run: diff <(tail -n +9 prisma/schema.prisma) <(tail -n +9 prisma/migration.schema.prisma)
      - name: No credential logging
        run: |
          if git grep -nE 'console\.[a-z]+\(.*(DB_PASS|DB_USER|SESSION_COOKIE_SECRET|DATABASE_URL|postgresql://)' -- . ':(exclude)docs' ':(exclude).github'; then
            echo "A console call prints a credential."
            exit 1
          fi
      - run: $NODE12 npm ci
      - run: $NODE12 npm run codegen
      - run: $NODE12 npx prisma generate
      - run: $NODE12 npm run typecheck
      - run: $NODE12 npm run lint
      - run: $NODE12 npm test
      - run: $NODE12 npm run test:integration
      - run: $NODE12 npm run build
      - run: $NODE12 npm run check:csp
      - name: npm audit (report only)
        run: $NODE12 npm audit --audit-level=high || true
